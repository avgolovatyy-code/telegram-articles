# Production stack for a single DigitalOcean droplet.
#
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build
#
# Caddy terminates TLS and obtains a certificate automatically, so the click-tracking
# URL (/r/<token>) is served over https. Set DEPLOY_DOMAIN and ACME_EMAIL in .env.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wegotrip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-wegotrip_engine}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wegotrip}"]
      interval: 10s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    command: alembic upgrade head
    restart: "no"
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-wegotrip}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wegotrip_engine}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-wegotrip}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wegotrip_engine}
      # Only the worker runs the scheduler, otherwise every job would run twice.
      SCHEDULER_ENABLED: "false"
      SECRETS_STORE_FILE: /app/var/secrets/secrets.enc
      SECRETS_KEY_FILE: /app/var/secrets/master.key
      TRACKING_BASE_URL: https://${DEPLOY_DOMAIN}
      ADMIN_BASE_URL: https://${DEPLOY_DOMAIN}
    volumes:
      - generated:/app/var/generated
      # The encrypted credential store and its master key. Shared with the worker so
      # both processes decrypt the same secrets; nothing is kept in plaintext.
      - secrets:/app/var/secrets
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    command: wgt worker
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-wegotrip}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wegotrip_engine}
      SCHEDULER_ENABLED: "true"
      SECRETS_STORE_FILE: /app/var/secrets/secrets.enc
      SECRETS_KEY_FILE: /app/var/secrets/master.key
      TRACKING_BASE_URL: https://${DEPLOY_DOMAIN}
      ADMIN_BASE_URL: https://${DEPLOY_DOMAIN}
    volumes:
      - generated:/app/var/generated
      - secrets:/app/var/secrets
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DEPLOY_DOMAIN: ${DEPLOY_DOMAIN:?set DEPLOY_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  generated:
  secrets:
  caddy_data:
  caddy_config:
