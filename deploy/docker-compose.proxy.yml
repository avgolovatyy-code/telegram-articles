# Co-locate on a host that already owns :80/:443 (e.g. tools-server nginx).
# Publish the API on a free loopback port; terminate TLS on the existing reverse proxy.
#
#   API_PORT=18765 docker compose -f deploy/docker-compose.proxy.yml --env-file .env up -d --build
#
# Then point an nginx/Caddy vhost at 127.0.0.1:${API_PORT}. See nginx-content-engine.conf.example.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wegotrip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-wegotrip_engine}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wegotrip}"]
      interval: 10s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    command: alembic upgrade head
    restart: "no"
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-wegotrip}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wegotrip_engine}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-wegotrip}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wegotrip_engine}
      SCHEDULER_ENABLED: "false"
      SECRETS_STORE_FILE: /app/var/secrets/secrets.enc
      SECRETS_KEY_FILE: /app/var/secrets/master.key
      TRACKING_BASE_URL: https://${DEPLOY_DOMAIN}
      ADMIN_BASE_URL: https://${DEPLOY_DOMAIN}
    ports:
      - "127.0.0.1:${API_PORT:-18765}:8000"
    volumes:
      - generated:/app/var/generated
      - secrets:/app/var/secrets
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    command: wgt worker
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-wegotrip}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wegotrip_engine}
      SCHEDULER_ENABLED: "true"
      SECRETS_STORE_FILE: /app/var/secrets/secrets.enc
      SECRETS_KEY_FILE: /app/var/secrets/master.key
      TRACKING_BASE_URL: https://${DEPLOY_DOMAIN}
      ADMIN_BASE_URL: https://${DEPLOY_DOMAIN}
    volumes:
      - generated:/app/var/generated
      - secrets:/app/var/secrets
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  generated:
  secrets:
