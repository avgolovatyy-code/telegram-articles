services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wegotrip
      POSTGRES_PASSWORD: wegotrip
      POSTGRES_DB: wegotrip_engine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wegotrip -d wegotrip_engine"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: .
    command: alembic upgrade head
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://wegotrip:wegotrip@db:5432/wegotrip_engine
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://wegotrip:wegotrip@db:5432/wegotrip_engine
      SCHEDULER_ENABLED: "false"
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: wgt worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://wegotrip:wegotrip@db:5432/wegotrip_engine
      SCHEDULER_ENABLED: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
